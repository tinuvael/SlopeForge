name: Windows Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slopeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/slopeforge_test
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run PostgreSQL integration tests
        run: python -m pytest -q -m postgres

  pr-checks:
    runs-on: windows-latest
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate Python code and non-PostgreSQL tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall app application domain infrastructure database repositories ui main.py updater_main.py
          python tools/architecture_audit.py | Out-Null
          python -m pytest -q -m "not postgres"

  build:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - postgres-tests
      - pr-checks
    runs-on: windows-latest
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build canonical Windows release
        shell: cmd
        run: build_release.bat

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from app.config import APP_VERSION; print(APP_VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Smoke-test portable and installer payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "release/SlopeForge-$version-Windows-x64.zip"
          $setup = "release/SlopeForge-$version-Windows-x64-Setup.exe"
          if (!(Test-Path $zip) -or !(Test-Path $setup)) { throw "Release artifacts are missing" }

          $portable = Join-Path $env:RUNNER_TEMP "portable"
          Expand-Archive $zip $portable
          $portablePayload = "$portable/SlopeForge"
          python tools/validate_windows_payload.py $portablePayload
          $portableUpdater = "$portablePayload/SlopeForgeUpdater.exe"
          $portableSmoke = Start-Process $portableUpdater -ArgumentList "--smoke-test" -Wait -PassThru
          if ($portableSmoke.ExitCode -ne 0) { throw "Portable SlopeForgeUpdater smoke test failed with exit code $($portableSmoke.ExitCode)" }
          $portableCredentialSmoke = Start-Process $portableUpdater -ArgumentList "--credential-smoke-test" -Wait -PassThru
          if ($portableCredentialSmoke.ExitCode -ne 0) { throw "Portable SlopeForgeUpdater Credential Manager smoke test failed with exit code $($portableCredentialSmoke.ExitCode)" }

          $installed = Join-Path $env:RUNNER_TEMP "installed"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installed" -Wait -NoNewWindow
          python tools/validate_windows_payload.py $installed
          if (!(Test-Path "$installed/SlopeForgeUpdater.exe")) { throw "Installer did not include SlopeForge Updater" }
          $installedSmoke = Start-Process "$installed/SlopeForgeUpdater.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($installedSmoke.ExitCode -ne 0) { throw "Installed SlopeForgeUpdater smoke test failed with exit code $($installedSmoke.ExitCode)" }
          $installedCredentialSmoke = Start-Process "$installed/SlopeForgeUpdater.exe" -ArgumentList "--credential-smoke-test" -Wait -PassThru
          if ($installedCredentialSmoke.ExitCode -ne 0) { throw "Installed SlopeForgeUpdater Credential Manager smoke test failed with exit code $($installedCredentialSmoke.ExitCode)" }
          if (!(Test-Path "$installed/unins000.exe")) { throw "Installer did not create an uninstaller" }
          Start-Process "$installed/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -NoNewWindow
          if (Test-Path "$installed/SlopeForge.exe") { throw "Silent uninstall left application files behind" }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SlopeForge-${{ steps.version.outputs.version }}-Windows-x64
          path: |
            release/SlopeForge-${{ steps.version.outputs.version }}-Windows-x64.zip
            release/SlopeForge-${{ steps.version.outputs.version }}-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
