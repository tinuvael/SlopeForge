name: Windows Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Require the main branch
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Windows Release may only run from main" }

      - name: Check out exact workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build canonical Windows release
        shell: cmd
        run: build_release.bat

      - name: Validate version and release safety
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "from app.config import APP_VERSION; import re; assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?', APP_VERSION); print(APP_VERSION)"
          if (!$version) { throw "APP_VERSION is empty or invalid" }
          $tag = "v$version"
          $zip = "release/SlopeForge-$version-Windows-x64.zip"
          $setup = "release/SlopeForge-$version-Windows-x64-Setup.exe"
          if (!(Test-Path $zip) -or !(Test-Path $setup)) { throw "Versioned release artifacts are missing" }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          function Assert-GitHubResourceAbsent {
            param(
              [Parameter(Mandatory = $true)][string]$Uri,
              [Parameter(Mandatory = $true)][string]$ExistsMessage,
              [Parameter(Mandatory = $true)][string]$VerifyMessage
            )

            try {
              Invoke-RestMethod -Uri $Uri -Headers $headers -Method Get -ErrorAction Stop | Out-Null
            }
            catch {
              $response = $_.Exception.Response
              if ($null -ne $response -and [int]$response.StatusCode -eq 404) {
                return
              }
              throw "${VerifyMessage}: $($_.Exception.Message)"
            }

            throw $ExistsMessage
          }

          $repo = "${{ github.repository }}"
          $escapedTag = [System.Uri]::EscapeDataString($tag)
          Assert-GitHubResourceAbsent `
            -Uri "https://api.github.com/repos/$repo/git/ref/tags/$escapedTag" `
            -ExistsMessage "Tag $tag already exists" `
            -VerifyMessage "Could not verify remote tag state"
          Assert-GitHubResourceAbsent `
            -Uri "https://api.github.com/repos/$repo/releases/tags/$escapedTag" `
            -ExistsMessage "GitHub Release $tag already exists" `
            -VerifyMessage "Could not verify GitHub Release state"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Smoke-test portable and installer payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          Expand-Archive "${{ steps.release.outputs.zip }}" $portable
          $portablePayload = "$portable/SlopeForge"
          python tools/validate_windows_payload.py $portablePayload
          $portableUpdater = "$portablePayload/SlopeForgeUpdater.exe"
          if (!(Test-Path $portableUpdater)) { throw "Portable payload did not include SlopeForge Updater" }
          $portableSmoke = Start-Process $portableUpdater -ArgumentList "--smoke-test" -Wait -PassThru
          if ($portableSmoke.ExitCode -ne 0) { throw "Portable SlopeForgeUpdater smoke test failed with exit code $($portableSmoke.ExitCode)" }
          $portableCredentialSmoke = Start-Process $portableUpdater -ArgumentList "--credential-smoke-test" -Wait -PassThru
          if ($portableCredentialSmoke.ExitCode -ne 0) { throw "Portable SlopeForgeUpdater Credential Manager smoke test failed with exit code $($portableCredentialSmoke.ExitCode)" }

          $installed = Join-Path $env:RUNNER_TEMP "installed"
          Start-Process "${{ steps.release.outputs.setup }}" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installed" -Wait -NoNewWindow
          python tools/validate_windows_payload.py $installed
          if (!(Test-Path "$installed/SlopeForgeUpdater.exe")) { throw "Installer did not include SlopeForge Updater" }
          $installedSmoke = Start-Process "$installed/SlopeForgeUpdater.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($installedSmoke.ExitCode -ne 0) { throw "Installed SlopeForgeUpdater smoke test failed with exit code $($installedSmoke.ExitCode)" }
          $installedCredentialSmoke = Start-Process "$installed/SlopeForgeUpdater.exe" -ArgumentList "--credential-smoke-test" -Wait -PassThru
          if ($installedCredentialSmoke.ExitCode -ne 0) { throw "Installed SlopeForgeUpdater Credential Manager smoke test failed with exit code $($installedCredentialSmoke.ExitCode)" }
          if (!(Test-Path "$installed/unins000.exe")) { throw "Installer did not create an uninstaller" }
          Start-Process "$installed/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -NoNewWindow
          if (Test-Path "$installed/SlopeForge.exe") { throw "Silent uninstall left application files behind" }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $prerelease = if ("${{ inputs.prerelease }}" -eq "true") { @("--prerelease") } else { @() }
          gh release create $tag `
            "${{ steps.release.outputs.zip }}" `
            "${{ steps.release.outputs.setup }}" `
            --target "${{ github.sha }}" `
            --repo "${{ github.repository }}" `
            --title "SlopeForge ${{ steps.release.outputs.version }}" `
            --generate-notes `
            @prerelease
